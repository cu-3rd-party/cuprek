services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: circlebot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # exposed on the host for local dev / running the test suite
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d circlebot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # override whatever is in .env so the bot talks to the compose service
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/circlebot
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
